<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Perfect Pair</title>
    <!-- Importing romantic and clean fonts from your Vault page -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-back: #ff4d6d;
            --card-front-bg: #7CB9E8; /* Custom card face background color */
            --text-color: #ff4b72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* DYNAMIC MOVING GRADIENT exactly from your Vault page */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffb1c1, #ffc3a0);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--text-color);
            margin-top: 15px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
            text-align: center;
        }

        p.subtitle {
            color: #555;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.1rem;
            text-align: center;
            font-weight: 400;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 10px;
            max-width: 600px;
            width: 95vw;
            max-height: 75vh; 
        }

        .card {
            aspect-ratio: 2 / 3.3; 
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .card-front {
            background-color: var(--card-front-bg); /* #7CB9E8 */
            transform: rotateY(180deg);
            /* Image display restored to 100% */
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            border: 3px solid #fff;
        }

        .card-back {
            background-color: var(--card-back);
            background-image: radial-gradient(circle, rgba(255,255,255,0.25) 20%, transparent 20%);
            background-size: 20px 20px;
            border: 3px solid #fff;
        }

        /* Ending Screen overlay */
        #ending-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #ending-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #ending-screen h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: #ff4b72;
            margin-bottom: 10px;
        }

        #ending-screen p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #ff4b72;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 75, 114, 0.4);
        }

        button:hover {
            background-color: #e6395e;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .game-board { gap: 8px; }
            h1 { font-size: 2.8rem; }
            #ending-screen h2 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <h1>The Perfect Pair</h1>
    <p class="subtitle">Find all the matching moments ❤️</p>

    <div class="game-board" id="game-board"></div>

    <div id="ending-screen">
        <h2>Happy Anniversary! ❤️</h2>
        <p>Just like these cards, we are a perfect match.</p>
        <div class="button-group">
            <button onclick="goToNextPage()">Continue ❤️</button>
            <button onclick="location.reload()" style="background-color: #888; box-shadow: none;">Play Again</button>
        </div>
    </div>

    <script>
        // CONFIGURATION: Set the URL you want the "Continue" button to navigate to
        const NEXT_PAGE_URL = "nextpage.html";

        // Using your .jpeg files
        const imageFiles = ['1.jpeg', '2.jpeg', '3.jpeg', '4.jpeg', '5.jpeg', '6.jpeg'];
        
        const cardsArray = [...imageFiles, ...imageFiles];
        
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;

        const board = document.getElementById('game-board');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function createBoard() {
            const shuffledCards = shuffle(cardsArray);
            shuffledCards.forEach((imageSrc) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.image = imageSrc;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front" style="background-image: url('${imageSrc}')"></div>
                        <div class="card-face card-back"></div>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.image === secondCard.dataset.image;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;

            resetBoard();

            if (matchedPairs === imageFiles.length) {
                setTimeout(() => {
                    document.getElementById('ending-screen').classList.add('visible');
                }, 800);
            }
        }

        function unflipCards() {
            lockBoard = true;

            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function goToNextPage() {
            window.location.href = NEXT_PAGE_URL;
        }

        createBoard();
    </script>
</body>
</html>
